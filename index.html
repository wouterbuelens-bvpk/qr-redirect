<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Even geduld...</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px 15px; background: #f4f7f6; color: #706f6f; margin: 0; }
    .card { background: white; padding: 30px 20px; border-radius: 8px; max-width: 380px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #008cd3; }
    .logo { max-width: 180px; margin-bottom: 15px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #008cd3; border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite; margin: 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { color: #b3261e; background: #fdecea; padding: 10px; border-radius: 4px; margin-top: 15px; display: none; font-size: 14px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lh3.googleusercontent.com/d/1F-Z9qZPejAZiJK-KLCRfvnmLbyu-zZfE" alt="HBO Genk Logo" class="logo">
    <div class="spinner" id="loader"></div>
    <p style="margin: 5px 0 10px 0; font-size: 14px;" id="message">Je wordt doorgestuurd...</p>
    <div id="error-box" class="error"></div>
  </div>

  <script>
    // Haal de 'id' op uit de URL (bijv. ?id=oupygm)
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    // Jouw gepubliceerde TSV-link
    const tsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQy4sRAPxk-jbpqkNzfDdmse6J6OZ9i4F5a1GegYV2a6zsxzx7Gxtfkjxe4wDwch5vUMwpr3nuS5rdu/pub?gid=0&single=true&output=tsv";

    if (id) {
      // Haal de spreadsheet op als platte tekst
      fetch(tsvUrl)
        .then(response => response.text())
        .then(tsvText => {
          // Splits de tekst in losse regels
          const rows = tsvText.split('\n');
          
          for (let i = 1; i < rows.length; i++) { // Start bij 1 om de header over te slaan
            // Splits de regel op tabs (TSV)
            const cols = rows[i].split('\t');
            
            // Controleer of de ID overeenkomt (negeer eventuele spaties)
            if (cols[0] && cols[0].trim() === id) {
              let targetUrl = cols[1] ? cols[1].trim() : "";
              
              // Verwijder eventuele aanhalingstekens die Google Sheets toevoegt
              targetUrl = targetUrl.replace(/^"|"$/g, '');

              if (targetUrl) {
                // Voeg https:// toe als het ontbreekt
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                  targetUrl = 'https://' + targetUrl;
                }
                
                // Verberg de loader en stuur de gebruiker direct door!
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').innerText = "Gevonden! Je wordt nu doorgestuurd...";
                window.location.replace(targetUrl);
                return;
              }
            }
          }
          // Als de loop klaar is en er is niks gevonden:
          showError("Fout: De link is niet gevonden of niet meer actief in de spreadsheet.");
        })
        .catch(err => {
          showError("Fout bij het ophalen van de gegevens. Controleer je internetverbinding.");
        });
    } else {
      showError("Fout: Geen id-parameter gevonden in de link. Scan de QR-code opnieuw.");
    }

    function showError(msg) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('message').style.display = 'none';
      const errBox = document.getElementById('error-box');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }
  </script>
</body>
</html>
