<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Even geduld...</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px 15px; background: #f4f7f6; color: #706f6f; margin: 0; }
    .card { background: white; padding: 30px 20px; border-radius: 8px; max-width: 380px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #008cd3; }
    .logo { max-width: 180px; margin-bottom: 15px; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #008cd3; border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite; margin: 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error { color: #b3261e; background: #fdecea; padding: 10px; border-radius: 4px; margin-top: 15px; display: none; font-size: 14px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lh3.googleusercontent.com/d/1F-Z9qZPejAZiJK-KLCRfvnmLbyu-zZfE" alt="HBO Genk Logo" class="logo">
    <div class="spinner" id="loader"></div>
    <p style="margin: 5px 0 10px 0; font-size: 14px;" id="message">Je wordt doorgestuurd...</p>
    <div id="error-box" class="error"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    // BELANGRIJK: Gebruik hier de URL van je Web App (zie stap 2 hieronder)
    const appsScriptUrl = "https://script.google.com/a/macros/verpleegopleiding-genk.be/s/AKfycbwZ6EaefW6xzzrv2F6miqcWXQNaI5h3_gWlAgbHLR_aSuYV5ilRyT_4XvAo8b-W35KtFg/exec";

    if (id) {
      const jsonpUrl = appsScriptUrl + "?id=" + encodeURIComponent(id) + "&format=jsonp&callback=handleRedirect";

      const script = document.createElement('script');
      script.src = jsonpUrl;
      script.onerror = function() {
        showError("Fout bij het ophalen van de bestemming. Controleer je internetverbinding of de Apps Script URL.");
      };
      document.body.appendChild(script);
    } else {
      showError("Fout: Geen id-parameter gevonden in de link. Scan de QR-code opnieuw.");
    }

    function handleRedirect(data) {
      if (data && data.url) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('message').innerText = "Gevonden! Je wordt nu doorgestuurd...";
        window.location.replace(data.url);
      } else if (data && data.error) {
        showError("Fout: De link is niet gevonden of niet meer actief in de spreadsheet.");
      } else {
        showError("Fout: Onbekend antwoord van de server.");
      }
    }

    function showError(msg) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('message').style.display = 'none';
      const errBox = document.getElementById('error-box');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }
  </script>
</body>
</html>
