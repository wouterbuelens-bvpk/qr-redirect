<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doorverwijzen...</title>
  <!-- VERVANG de URL hieronder door JOUW Apps Script /exec-URL -->
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/a/macros/verpleegopleiding-genk.be/s/AKfycbyKUbD_0BDcCmqaKNy0BAJCgfhy_YFN4pWJTw_paMxLk1NwEEiWinMu_6Crcn074jcgCQ/exec";
  </script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px 15px; background: #f4f7f6; color: #706f6f; margin: 0; }
    .card { background: white; padding: 30px 20px; border-radius: 8px; max-width: 380px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 6px solid #008cd3; }
    .logo { max-width: 180px; margin-bottom: 15px; }
    .btn { display: inline-block; background-color: #95c11f; color: white; padding: 14px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 15px; font-size: 15px; }
    .btn:hover { background-color: #7da518; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #008cd3; border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite; margin: 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fout { background: #fdecea; color: #b3261e; padding: 10px; border-radius: 4px; font-size: 13px; margin-top: 15px; border-left: 4px solid #b3261e; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lh3.googleusercontent.com/d/1F-Z9qZPejAZiJK-KLCRfvnmLbyu-zZfE" alt="HBO Genk Logo" class="logo">
    <div class="spinner" id="spinner"></div>
    <p id="boodschap" style="margin: 5px 0 10px 0; font-size: 14px;">Je wordt doorgestuurd...</p>
    <a id="redirectBtn" href="#" class="btn" style="display:none;">Klik hier om door te gaan</a>
    <div id="fout" class="fout" style="display:none;"></div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        toonFout("Geen geldige QR-code. Ontbreekt het id-parameter?");
        return;
      }

      // JSONP-callback: Apps Script roept deze functie aan met het resultaat
      window.__qrCallback = function (data) {
        if (data && data.url) {
          // Echte browser-redirect — geen iframe, geen waarschuwing
          window.location.replace(data.url);
        } else {
          toonFout("Deze QR-code is niet meer actief of niet gevonden.");
        }
      };

      // JSONP-script tag injecteren
      const script = document.createElement("script");
      script.src = APPS_SCRIPT_URL
        + "?id=" + encodeURIComponent(id)
        + "&format=jsonp&callback=__qrCallback";
      script.onerror = function () {
        toonFout("Kan de server niet bereiken. Probeer opnieuw.");
      };
      document.body.appendChild(script);

      // Timeout van 5 seconden
      setTimeout(function () {
        if (document.getElementById("spinner").style.display !== "none") {
          toonFout("De server antwoordt niet. Probeer opnieuw.");
        }
      }, 5000);

      function toonFout(bericht) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("boodschap").style.display = "none";
        const fout = document.getElementById("fout");
        fout.innerText = bericht;
        fout.style.display = "block";
      }
    })();
  </script>
</body>
</html>
